name: Release

# Publishes MacExcelReader to NuGet when a version tag such as v1.0.0 is pushed. The package version is the tag
# without its "v". It uses NuGet Trusted Publishing: nuget.org trusts this workflow file through a policy on the
# account, and NuGet/login swaps the workflow's GitHub identity for a short-lived API key, so no key is stored.
# Needs the repository secret NUGET_USER, the nuget.org account name the policy belongs to.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read
  id-token: write   # lets NuGet/login ask GitHub for the workflow's identity token

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore MacExcelReader.sln

      - name: Build
        run: dotnet build MacExcelReader.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test tests --configuration Release --no-build

      - name: Pack
        run: dotnet pack src --configuration Release --no-build --output packages -p:Version=${{ steps.version.outputs.version }}

      - name: Log in to NuGet with Trusted Publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        # Pushing the .nupkg also pushes the .snupkg beside it to the symbol server.
        run: dotnet nuget push "packages/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: package
          path: packages
