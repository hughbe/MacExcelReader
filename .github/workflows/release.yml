name: Release

# Publishes MacExcelReader to NuGet when a version tag such as v1.0.0 is pushed. The package version is the tag
# without its "v". Needs the repository secret NUGET_API_KEY.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore MacExcelReader.sln

      - name: Build
        run: dotnet build MacExcelReader.sln --configuration Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test tests --configuration Release --no-build

      - name: Pack
        run: dotnet pack src --configuration Release --no-build --output packages -p:Version=${{ steps.version.outputs.version }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::The repository secret NUGET_API_KEY is not set."
            exit 1
          fi
          # Pushing the .nupkg also pushes the .snupkg beside it to the symbol server.
          dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: packages
